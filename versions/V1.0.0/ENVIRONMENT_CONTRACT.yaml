schema_version: 1
release: V1.0.0
authority: online_server_or_github_actions
local_machine: source_edit_static_check_evidence_only
api_policy:
  allowed_api_level: 36
  api_channel: stable
  forbidden_api_levels: all_except_36
  explicitly_forbidden_api_levels: [37]
  emulator_execution: github_actions_only
  on_mismatch: reject_before_build
reuse_order:
  - existing_server_runtime
  - existing_docker_images_and_caches
  - isolated_server_directory_container_or_volume
  - github_actions
jdk:
  accepted: '>=17'
  preferred_if_available: '21'
contract_pins:
  compile_sdk: 36
  target_sdk: 36
  allowed_api_level: 36
  api_channel: stable
  stable_api_level: 36
  forbidden_api_levels: all_except_36
  explicitly_forbidden_api_levels: [37]
  build_tools: 36.0.0
  gradle: 9.5.0
  agp: 9.3.0
business_protection:
  isolated_paths_required: true
  do_not_replace_system_runtime: true
  do_not_change_business_services: true
  do_not_bind_business_ports: true
  do_not_restart_business_services: true
required_evidence:
  - readonly_inventory
  - actual_paths_and_versions
  - reuse_or_supplement_decision
  - validation_log
  - same_commit_provenance
actual_environment:
  host: obx-test
  backend:
    php_path: /usr/bin/php
    php_version: 7.4.33
    discuz_version: X5.0
    mysql_version: 5.7.44
    discuz_root: /www/wwwroot/stk_zz_yihao_com
    validation: online_php_lint_and_isolated_backend_tests
  image: hhy-android-toolchain:r08-api36-cache
  jdk_path: /opt/java/openjdk
  jdk_version: 21.0.9
  gradle_path: /opt/stk-build/gradle/gradle-9.5.0/bin/gradle
  gradle_version: 9.5.0
  sdk_path: /opt/stk-build/android-sdk
  sdk_packages:
    - platforms;android-36
    - build-tools;36.0.0
    - system-images;android-36;google_apis;x86_64
    # platform-tools/emulator are stable SDK tools; their tool release number is recorded by CI and is not an API level.
  sdk_tool_policy: stable_non_preview_api_independent
  isolated_source_path: /opt/stk-build/src
  isolated_signing_path: /opt/stk-build/signing
  decision: reused_server_image_jdk_gradle_cache_and_sdk_for_apk_build; emulator_gate_routed_to_github_actions
  validation: online_release_and_android_test_build_success
  validation_log: /opt/stk-build/stk-v100-build.log
  emulator_note: not_started_on_server; api36_instrumentation_and_visual_acceptance_github_actions_only
gates:
  apk_build:
    name: APK_BUILD_GATE
    requires_kvm: false
    execution: online_server_or_github_actions
    artifact_policy: build_once_upload_same_commit
  emulator_acceptance:
    name: EMULATOR_ACCEPTANCE_GATE
    required_for_full_release: true
    api_level: 36
    execution: github_actions_only
    artifact_policy: download_exact_build_artifact_no_rebuild
  missing_kvm_policy:
    blocks_apk_build: false
    action: route_emulator_gate_to_github_actions_api36_runner_and_record_evidence
