schema_version: 1
release: V1.2.0
authority: online_server_or_github_actions
local_machine: source_edit_static_check_evidence_only
reuse_order: [existing_server_runtime, existing_docker_images_and_caches, isolated_server_directory_container_or_volume, github_actions]
jdk: {accepted: '>=17', preferred_if_available: '21'}
contract_pins: {compile_sdk: 36, target_sdk: 36, allowed_api_level: 36, api_channel: stable, stable_api_level: 36, forbidden_api_levels: all_except_36, build_tools: 36.0.0, gradle: 9.5.0, agp: 9.3.0}
business_protection: {isolated_paths_required: true, do_not_replace_system_runtime: true, do_not_change_business_services: true, do_not_bind_business_ports: true, do_not_restart_business_services: true}
required_evidence: [readonly_inventory, actual_paths_and_versions, reuse_or_supplement_decision, validation_log, same_commit_provenance]
gates:
  apk_build:
    name: APK_BUILD_GATE
    requires_kvm: false
    execution: online_server_or_github_actions
    artifact_policy: build_once_upload_same_commit
  emulator_acceptance:
    name: EMULATOR_ACCEPTANCE_GATE
    required_for_full_release: true
    api_level: 36
    execution: github_actions_only
    artifact_policy: download_exact_build_artifact_no_rebuild
  missing_kvm_policy:
    blocks_apk_build: false
    action: route_emulator_gate_to_github_actions_api36_runner_and_record_evidence
