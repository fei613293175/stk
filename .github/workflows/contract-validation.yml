name: Contract validation

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-validation:
    name: contract-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install contract tools
        run: python -m pip install --requirement requirements-tools.txt
      - name: Validate IDs, references, domains and version closure
        run: python scripts/validate_package.py
      - name: Validate planned mockup matrix without pretending approval
        run: python scripts/check_mockup_readiness.py --all --allow-planned
      - name: Validate deterministic mockup jobs
        run: python scripts/generate_mockup_jobs.py --check-only
      - name: Reject business UI hardcoded values when Android source exists
        run: python scripts/check_no_ui_hardcoding.py --allow-missing-source
