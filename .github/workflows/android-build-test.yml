name: Android and backend build test

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'android-app/**'
      - 'source/plugin/**'
  pull_request:
    paths:
      - 'android-app/**'
      - 'source/plugin/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-test:
    name: android-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STK_RELEASE_KEYSTORE_BASE64: ${{ secrets.STK_RELEASE_KEYSTORE_BASE64 }}
      STK_RELEASE_STORE_PASSWORD: ${{ secrets.STK_RELEASE_STORE_PASSWORD }}
      STK_RELEASE_KEY_ALIAS: ${{ secrets.STK_RELEASE_KEY_ALIAS }}
      STK_RELEASE_KEY_PASSWORD: ${{ secrets.STK_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install tools
        run: python -m pip install --requirement requirements-tools.txt
      - name: Validate contracts and UI token usage
        run: |
          python scripts/validate_package.py
          python scripts/check_no_ui_hardcoding.py
      - name: Prepare release signing
        run: bash scripts/ci/prepare_release_signing.sh
      - name: Test Discuz plugins
        run: bash scripts/ci/run_backend_tests.sh
      - name: Android lint, unit tests and signed release build
        working-directory: android-app
        run: ./gradlew --no-daemon --stacktrace lintRelease testReleaseUnitTest assembleRelease
      - name: Verify APK identity and real size
        run: python scripts/verify_release_artifact.py --apk-glob 'android-app/app/build/outputs/apk/release/*.apk'
      - name: Upload exact build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stk-release-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/**/build/reports/**
          if-no-files-found: error
          retention-days: 30
