name: Release acceptance and provenance

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'V1.0.0 ... V1.4.0'
        required: true
        type: string
      previous_tag:
        description: 'Previous accepted tag; empty for V1.0.0'
        required: false
        type: string
  push:
    tags:
      - 'stk-android-v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-exact-artifact:
    name: build-exact-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STK_RELEASE_KEYSTORE_BASE64: ${{ secrets.STK_RELEASE_KEYSTORE_BASE64 }}
      STK_RELEASE_STORE_PASSWORD: ${{ secrets.STK_RELEASE_STORE_PASSWORD }}
      STK_RELEASE_KEY_ALIAS: ${{ secrets.STK_RELEASE_KEY_ALIAS }}
      STK_RELEASE_KEY_PASSWORD: ${{ secrets.STK_RELEASE_KEY_PASSWORD }}
      STK_RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - run: python -m pip install --requirement requirements-tools.txt
      - run: python scripts/resolve_ci_release.py --write-github-env
      - run: python scripts/validate_package.py
      - run: python scripts/check_mockup_readiness.py --release "$STK_RELEASE_ID"
      - run: bash scripts/ci/prepare_release_signing.sh
      - run: bash scripts/ci/run_backend_tests.sh
      - name: Build signed Universal Release APK once
        working-directory: android-app
        run: gradle --no-daemon --stacktrace clean :app:lintRelease :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: Normalize artifact name and write build information
        run: python scripts/verify_release_artifact.py --apk-glob 'android-app/app/build/outputs/apk/release/*.apk' --normalize artifacts/release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: stk-exact-release-${{ github.sha }}
          path: |
            artifacts/release/**
            android-app/app/build/outputs/apk/androidTest/release/*.apk
          if-no-files-found: error
          retention-days: 90

  test-exact-artifact:
    name: test-exact-artifact
    needs: build-exact-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      STK_RELEASE_ID: ${{ inputs.release_id }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - run: python -m pip install --requirement requirements-tools.txt
      - uses: actions/download-artifact@v8.0.1
        with:
          name: stk-exact-release-${{ github.sha }}
          path: artifacts/exact
      - run: python scripts/resolve_ci_release.py --write-github-env
      - name: Download previous accepted APK for upgrade test
        run: bash scripts/ci/download_previous_release.sh
      - name: Enable KVM for the API 37 emulator
        run: |
          set -euo pipefail
          [[ -e /dev/kvm ]] || { echo '::error::GitHub runner does not expose /dev/kvm'; exit 1; }
          sudo chmod 666 /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]]
          ls -l /dev/kvm
      - name: Test the exact downloaded APK on API 37 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          locale: zh-CN
          disk-size: 8192M
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          disable-animations: true
          script: bash scripts/ci/run_exact_release_acceptance.sh
      - run: python scripts/compare_visuals.py --release "$STK_RELEASE_ID" --fail-on-diff
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: stk-release-evidence-${{ github.sha }}
          path: |
            artifacts/emulator/**
            artifacts/visual/**
          if-no-files-found: warn
          retention-days: 90

  release-provenance:
    name: release-provenance
    needs: [build-exact-artifact, test-exact-artifact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: stk-exact-release-${{ github.sha }}
          path: accepted/release
      - uses: actions/download-artifact@v8.0.1
        with:
          name: stk-release-evidence-${{ github.sha }}
          path: accepted/evidence
      - name: Build accepted delivery bundle without rebuilding APK
        run: python scripts/create_release_bundle.py --source accepted --output accepted-bundle
      - name: Attest exact APK provenance
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: 'accepted/release/**/*.apk'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: stk-accepted-delivery-${{ github.sha }}
          path: accepted-bundle/**
          if-no-files-found: error
          retention-days: 90
