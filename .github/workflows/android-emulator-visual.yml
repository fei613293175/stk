name: Android emulator and visual acceptance

on:
  push:
    branches: ['release/**']
    paths:
      - 'android-app/**'
      - 'ui/mockups/approved/**'
      - 'contracts/**'
      - 'scripts/**'
      - '.github/workflows/android-emulator-visual.yml'
  workflow_dispatch:
    inputs:
      release_id:
        description: 'V1.0.0 ... V1.4.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-emulator-visual:
    name: android-emulator-visual
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STK_RELEASE_KEYSTORE_BASE64: ${{ secrets.STK_RELEASE_KEYSTORE_BASE64 }}
      STK_RELEASE_STORE_PASSWORD: ${{ secrets.STK_RELEASE_STORE_PASSWORD }}
      STK_RELEASE_KEY_ALIAS: ${{ secrets.STK_RELEASE_KEY_ALIAS }}
      STK_RELEASE_KEY_PASSWORD: ${{ secrets.STK_RELEASE_KEY_PASSWORD }}
      STK_SIGNING_MODE: ci-test
      STK_RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - run: python -m pip install --requirement requirements-tools.txt
      - run: bash scripts/ci/prepare_release_signing.sh
      - name: Resolve release from branch when input is empty
        run: python scripts/resolve_ci_release.py --write-github-env
      - name: Block visual acceptance until every required image is approved
        run: python scripts/check_mockup_readiness.py --release "$STK_RELEASE_ID"
      - name: Build APK and instrumentation APK before emulator boot
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: API 37 Pixel 6 emulator, all interactions and screenshot capture
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_6
          channel: canary
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/run_emulator_acceptance.sh
      - name: Compare actual screenshots against approved mockups
        run: python scripts/compare_visuals.py --release "$STK_RELEASE_ID" --fail-on-diff
      - name: Upload emulator and visual evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stk-emulator-visual-${{ github.sha }}
          path: |
            artifacts/emulator/**
            artifacts/visual/**
            android-app/**/build/reports/androidTests/**
            android-app/**/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 30
