name: Android emulator and visual acceptance

on:
  workflow_run:
    workflows: ['Android and backend build test']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  android-emulator-visual:
    name: android-emulator-visual
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STK_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      STK_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - run: python -m pip install --requirement requirements-tools.txt
      - name: Resolve release from branch when input is empty
        run: python scripts/resolve_ci_release.py --write-github-env
      - name: Block visual acceptance until every required image is approved
        run: python scripts/check_mockup_readiness.py --release "$STK_RELEASE_ID"
      - name: Download exact APK build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: stk-release-${{ github.event.workflow_run.head_sha }}
          path: artifacts/exact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify exact Artifact contains release and instrumentation APKs
        run: |
          set -euo pipefail
          release_count=$(find artifacts/exact -type f -name '*.apk' ! -name '*androidTest*' | wc -l)
          test_count=$(find artifacts/exact -type f -name '*androidTest*.apk' | wc -l)
          [[ "$release_count" -eq 1 && "$test_count" -eq 1 ]]
      - name: Enable KVM for the API 37 emulator
        run: |
          set -euo pipefail
          [[ -e /dev/kvm ]] || { echo '::error::GitHub runner does not expose /dev/kvm'; exit 1; }
          sudo chmod 666 /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]]
          ls -l /dev/kvm
      - name: API 37 Pixel 6 emulator, all interactions and screenshot capture
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          channel: canary
          disk-size: 8192M
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader -feature -ReadColorBufferDma -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          disable-animations: true
          script: bash scripts/ci/run_emulator_acceptance.sh
      - name: Compare actual screenshots against approved mockups
        run: python scripts/compare_visuals.py --release "$STK_RELEASE_ID" --fail-on-diff
      - name: Upload emulator and visual evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stk-emulator-visual-${{ github.event.workflow_run.head_sha }}
          path: |
            artifacts/emulator/**
            artifacts/visual/**
          if-no-files-found: warn
          retention-days: 30
