name: Backend online static validation

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'source/plugin/**'
      - 'backend/sql/**'
      - 'scripts/verify_database_contract.py'
  pull_request:
    paths:
      - 'source/plugin/**'
      - 'backend/sql/**'
      - 'scripts/verify_database_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,openssl,mbstring,mysqli
          coverage: none
      - name: Lint every plugin PHP file online
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find source/plugin/stk_auth source/plugin/stk_project -type f -name '*.php' -print0)
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement requirements-tools.txt
      - run: python scripts/verify_database_contract.py
