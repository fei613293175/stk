schema_version: 1
page:
  page_id: ME-OV-001
  name: 退出登录确认
  surface: android
  visual_type: OVERLAY
  route: overlay://logout
  introduced_in: V1.0.0
  layout_profile: OVERLAY
  parent_page_id: ME-011
  identity_signature: 退出说明+取消/确认退出
  notes: 服务端撤销刷新令牌，客户端清理敏感数据
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: OVERLAY
  profile_values:
    top_bar: parent
    bottom_nav: parent
    dialog_width: 326
    scrim: '#00000066'
    dominant: dialog_or_bottom_sheet
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 退出说明+取消/确认退出
- 服务端撤销刷新令牌，客户端清理敏感数据
required_states:
- state_id: ME-OV-001-S01
  state_code: DEFAULT
  name: 确认退出
  description: 取消或退出
  introduced_in: V1.0.0
  mockup_id: M-ME-OV-001-S01
  mockup_path: ui/mockups/approved/V1.0.0/ME-OV-001/M-ME-OV-001-S01__DEFAULT__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-OV-001-S02
  state_code: SUBMITTING
  name: 退出中
  description: 撤销令牌
  introduced_in: V1.0.0
  mockup_id: M-ME-OV-001-S02
  mockup_path: ui/mockups/approved/V1.0.0/ME-OV-001/M-ME-OV-001-S02__SUBMITTING__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-OV-001-S03
  state_code: FAILED
  name: 退出请求失败
  description: 本地安全退出并记录待撤销
  introduced_in: V1.0.0
  mockup_id: M-ME-OV-001-S03
  mockup_path: ui/mockups/approved/V1.0.0/ME-OV-001/M-ME-OV-001-S03__FAILED__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-LOGOUT-001
  feature_id: AUTH-006
  name: 确认退出登录
  interaction_type: TAP
  test_tag: logout_confirm
  action: 点击退出
  target: 撤销令牌并清理本地
  api_operation_id: logout
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-LOGOUT-002
  feature_id: AUTH-006
  name: 取消退出登录
  interaction_type: TAP
  test_tag: logout_cancel
  action: 点击取消
  target: 关闭弹层
  api_operation_id: LOCAL_DISMISS
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
