  name: 需要登录
  description: 无有效令牌，转入登录页前的短暂状态
  introduced_in: V1.0.0
  mockup_id: M-SYS-001-S02
  mockup_path: ui/mockups/approved/V1.0.0/SYS-001/M-SYS-001-S02__AUTH_REQUIRED__1170x2532.png
