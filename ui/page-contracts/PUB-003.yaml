schema_version: 1
page:
  page_id: PUB-003
  name: 发布提交结果
  surface: android
  visual_type: PAGE
  route: stk://publish/result
  introduced_in: V1.2.0
  layout_profile: RESULT
  parent_page_id: PUB-001
  identity_signature: 结果插图+审核状态+查看/继续发布
  notes: 结果必须来自服务端真实状态
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: RESULT
  profile_values:
    top_bar: 56
    bottom_nav: none
    horizontal_padding: 24
    illustration: 112
    dominant: centered_result
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 结果插图+审核状态+查看/继续发布
- 结果必须来自服务端真实状态
required_states:
- state_id: PUB-003-S01
  state_code: PENDING
  name: 已提交待审核
  description: 进入我的发布
  introduced_in: V1.2.0
  mockup_id: M-PUB-003-S01
  mockup_path: ui/mockups/approved/V1.2.0/PUB-003/M-PUB-003-S01__PENDING__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-003-S02
  state_code: PUBLISHED
  name: 直接发布成功
  description: 查看详情
  introduced_in: V1.2.0
  mockup_id: M-PUB-003-S02
  mockup_path: ui/mockups/approved/V1.2.0/PUB-003/M-PUB-003-S02__PUBLISHED__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-003-S03
  state_code: FAILED
  name: 服务端未接受
  description: 返回编辑并保留数据
  introduced_in: V1.2.0
  mockup_id: M-PUB-003-S03
  mockup_path: ui/mockups/approved/V1.2.0/PUB-003/M-PUB-003-S03__FAILED__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-RESULT-001
  feature_id: PUBLISH-002
  name: 查看已提交项目
  interaction_type: TAP
  test_tag: publish_result_view
  action: 点击查看
  target: 项目详情
  api_operation_id: getProjectDetail
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-RESULT-002
  feature_id: PUBLISH-002
  name: 继续发布
  interaction_type: TAP
  test_tag: publish_result_again
  action: 点击继续发布
  target: PUB-001
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-RESULT-003
  feature_id: PUBLISH-004
  name: 进入我的发布
  interaction_type: TAP
  test_tag: publish_result_my_projects
  action: 点击我的发布
  target: ME-002
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
