  mockup_status: APPROVED
- state_id: ME-012-S02
  state_code: CHECKING_UPDATE
  name: 检查更新
  description: 进度
  introduced_in: V1.4.0
  mockup_id: M-ME-012-S02
  mockup_path: ui/mockups/approved/V1.4.0/ME-012/M-ME-012-S02__CHECKING_UPDATE__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-012-S03
  state_code: UP_TO_DATE
  name: 已是最新版
  description: 结果提示
  introduced_in: V1.4.0
  mockup_id: M-ME-012-S03
