allowed_interactions:
- interaction_id: INT-DETAIL-001
  feature_id: HOME-003
  name: 详情返回
  interaction_type: TAP
  test_tag: project_detail_back
  action: 点击返回
  target: 上一页
  api_operation_id: LOCAL_BACK
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-DETAIL-002
  feature_id: HOME-003
  name: 打开图片查看器
  interaction_type: TAP
  test_tag: project_image_{index}
  action: 点击图片
  target: HOME-OV-001
  api_operation_id: LOCAL_OVERLAY
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-DETAIL-003
  feature_id: HOME-005
  name: 打开联系方式
  interaction_type: TAP
  test_tag: project_contact
  action: 点击联系
  target: HOME-OV-002
  api_operation_id: LOCAL_OVERLAY
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-DETAIL-004
  feature_id: HOME-005
  name: 复制项目链接
  interaction_type: TAP
  test_tag: project_share
  action: 点击分享
  target: 系统分享面板
  api_operation_id: LOCAL_SHARE
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-DETAIL-005
  feature_id: HOME-003
  name: 详情重试
  interaction_type: TAP
  test_tag: project_detail_retry
  action: 点击重试
  target: 详情 API
  api_operation_id: getProjectDetail
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-DETAIL-006
  feature_id: PUBLISH-003
  name: 本人项目编辑
  interaction_type: TAP
  test_tag: owner_project_edit
  action: 点击编辑
  target: PUB-004
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-DETAIL-007
  feature_id: PUBLISH-003
  name: 本人项目下架
  interaction_type: TAP
  test_tag: owner_project_offline
  action: 点击下架
