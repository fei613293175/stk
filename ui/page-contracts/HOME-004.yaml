schema_version: 1
page:
  page_id: HOME-004
  name: 项目详情
  surface: android
  visual_type: PAGE
  route: stk://project/{project_id}
  introduced_in: V1.0.0
  layout_profile: DETAIL
  parent_page_id: null
  identity_signature: 项目图片+标题简介+发布者+联系方式+底部操作
  notes: 公开详情不显示完整手机号作为用户名
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: DETAIL
  profile_values:
    top_bar: 56
    bottom_nav: none
    hero_ratio: '16:9'
    horizontal_padding: 16
    section_gap: 20
    sticky_action_height: 72
    dominant: project_hero_and_full_content
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 项目图片+标题简介+发布者+联系方式+底部操作
- 公开详情不显示完整手机号作为用户名
