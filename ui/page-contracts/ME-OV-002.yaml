  name: 待审核项目操作
  description: 查看/编辑/撤回策略
  introduced_in: V1.2.0
  mockup_id: M-ME-OV-002-S01
  mockup_path: ui/mockups/approved/V1.2.0/ME-OV-002/M-ME-OV-002-S01__PENDING__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-OV-002-S02
  state_code: PUBLISHED
  name: 已发布项目操作
  description: 查看/编辑/下架
  introduced_in: V1.2.0
  mockup_id: M-ME-OV-002-S02
  mockup_path: ui/mockups/approved/V1.2.0/ME-OV-002/M-ME-OV-002-S02__PUBLISHED__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-OV-002-S03
  state_code: REJECTED
  name: 驳回项目操作
  description: 查看原因/编辑/重提/删除
  introduced_in: V1.2.0
  mockup_id: M-ME-OV-002-S03
  mockup_path: ui/mockups/approved/V1.2.0/ME-OV-002/M-ME-OV-002-S03__REJECTED__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-OV-002-S04
  state_code: OFFLINE
  name: 下架项目操作
  description: 查看/编辑/删除
  introduced_in: V1.2.0
  mockup_id: M-ME-OV-002-S04
  mockup_path: ui/mockups/approved/V1.2.0/ME-OV-002/M-ME-OV-002-S04__OFFLINE__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-ACT-001
  feature_id: PUBLISH-003
  name: 项目操作查看
  interaction_type: TAP
  test_tag: project_action_view
  action: 点击查看
  target: HOME-004
  api_operation_id: getProjectDetail
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-ACT-002
  feature_id: PUBLISH-003
  name: 项目操作编辑
  interaction_type: TAP
  test_tag: project_action_edit
  action: 点击编辑
  target: PUB-004
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-ACT-003
  feature_id: PUBLISH-003
  name: 项目操作下架
  interaction_type: TAP
  test_tag: project_action_offline
  action: 点击下架
  target: 状态 API
  api_operation_id: offlineProject
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-ACT-004
  feature_id: PUBLISH-003
  name: 项目操作重提
  interaction_type: TAP
  test_tag: project_action_resubmit
  action: 点击重提
  target: 状态 API
  api_operation_id: resubmitProject
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-ACT-005
  feature_id: PUBLISH-003
  name: 项目操作删除
  interaction_type: TAP
  test_tag: project_action_delete
  action: 点击删除
  target: 删除 API
  api_operation_id: deleteProject
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-ACT-006
  feature_id: PUBLISH-003
  name: 关闭项目操作
  interaction_type: TAP
  test_tag: project_action_close
  action: 点击关闭
  target: 我的发布
  api_operation_id: LOCAL_DISMISS
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
