schema_version: 1
page:
  page_id: ME-OV-002
  name: 本人项目操作面板
  surface: android
  visual_type: OVERLAY
  route: overlay://my-project-actions
  introduced_in: V1.2.0
  layout_profile: OVERLAY
  parent_page_id: ME-002
  identity_signature: 查看/编辑/下架/重提/删除按状态显示
  notes: 操作项由项目状态机白名单决定
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: OVERLAY
  profile_values:
    top_bar: parent
    bottom_nav: parent
    dialog_width: 326
    scrim: '#00000066'
    dominant: dialog_or_bottom_sheet
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 查看/编辑/下架/重提/删除按状态显示
- 操作项由项目状态机白名单决定
required_states:
- state_id: ME-OV-002-S01
