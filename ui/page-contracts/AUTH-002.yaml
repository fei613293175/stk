schema_version: 1
page:
  page_id: AUTH-002
  name: 注册
  surface: android
  visual_type: PAGE
  route: stk://auth/register
  introduced_in: V1.0.0
  layout_profile: AUTH
  parent_page_id: null
  identity_signature: 手机号+密码+确认密码+协议+注册按钮
  notes: 注册不发送短信验证码
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: AUTH
  profile_values:
    top_bar: none
    bottom_nav: none
    horizontal_padding: 24
    top_safe_gap: 48
    logo_size: 64
    form_gap: 12
    primary_button_height: 48
    dominant: brand_header_and_form
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 手机号+密码+确认密码+协议+注册按钮
- 注册不发送短信验证码
required_states:
- state_id: AUTH-002-S01
  state_code: DEFAULT
  name: 注册默认
  description: 手机号、密码、确认密码和协议
  introduced_in: V1.0.0
  mockup_id: M-AUTH-002-S01
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S01__DEFAULT__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-002-S02
  state_code: FIELD_FOCUSED
  name: 输入聚焦
  description: 键盘与聚焦样式
  introduced_in: V1.0.0
  mockup_id: M-AUTH-002-S02
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S02__FIELD_FOCUSED__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-002-S03
  state_code: PHONE_EXISTS
  name: 手机号已注册
  description: 引导返回登录或找回密码
  introduced_in: V1.0.0
  mockup_id: M-AUTH-002-S03
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S03__PHONE_EXISTS__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-002-S04
  state_code: PASSWORD_MISMATCH
  name: 两次密码不一致
  description: 确认密码错误提示
  introduced_in: V1.0.0
  mockup_id: M-AUTH-002-S04
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S04__PASSWORD_MISMATCH__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-002-S05
  state_code: AGREEMENT_REQUIRED
  name: 未同意协议
  description: 协议勾选区域高亮
  introduced_in: V1.0.0
