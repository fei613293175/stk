  mockup_status: APPROVED
- state_id: AUTH-002-S07
  state_code: CAPTCHA_REQUIRED
  name: 等待安全验证码
  description: 注册提交前弹出
  introduced_in: V1.0.0
  mockup_id: M-AUTH-002-S07
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S07__CAPTCHA_REQUIRED__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-002-S08
  state_code: SUBMITTING
  name: 注册提交中
  description: 禁止重复提交
  introduced_in: V1.0.0
  mockup_id: M-AUTH-002-S08
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S08__SUBMITTING__1170x2532.png
