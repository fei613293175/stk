  mockup_id: M-AUTH-002-S12
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S12__SERVER_ERROR__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-REG-001
  feature_id: AUTH-003
  name: 输入注册手机号
  interaction_type: INPUT
  test_tag: register_phone
  action: 输入手机号
  target: 手机号字段
  api_operation_id: LOCAL_VALIDATION
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-REG-002
  feature_id: AUTH-003
  name: 输入注册密码
  interaction_type: INPUT
  test_tag: register_password
  action: 输入密码
  target: 密码字段
  api_operation_id: LOCAL_VALIDATION
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-REG-003
  feature_id: AUTH-003
  name: 输入确认密码
  interaction_type: INPUT
  test_tag: register_password_confirm
  action: 再次输入密码
  target: 确认密码字段
  api_operation_id: LOCAL_VALIDATION
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-REG-004
  feature_id: AUTH-003
  name: 切换密码可见性
  interaction_type: TAP
  test_tag: register_password_visibility
  action: 点击眼睛图标
  target: 密码可见性
  api_operation_id: LOCAL_UI_STATE
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-REG-005
  feature_id: AUTH-003
  name: 同意用户协议
  interaction_type: TAP
  test_tag: register_agreement_check
  action: 点击勾选
  target: 协议状态
  api_operation_id: LOCAL_UI_STATE
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-REG-006
  feature_id: AUTH-003
  name: 提交注册
  interaction_type: TAP
  test_tag: register_submit
  action: 点击注册
  target: 先打开安全验证码
  api_operation_id: registerUser
  introduced_in: V1.0.0
  expected_result: 不发送短信；创建 Discuz UID、手机号绑定、会员基础记录和双账户记录
- interaction_id: INT-REG-007
  feature_id: AUTH-001
  name: 返回登录
  interaction_type: TAP
  test_tag: register_back_login
  action: 点击已有账号登录
  target: stk://auth/login
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-REG-008
  feature_id: AUTH-007
  name: 注册页打开协议
  interaction_type: TAP
  test_tag: register_open_agreement
  action: 点击用户协议
  target: stk://legal/user-agreement
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-REG-009
  feature_id: AUTH-007
  name: 注册页打开隐私政策
  interaction_type: TAP
  test_tag: register_open_privacy
  action: 点击隐私政策
  target: stk://legal/privacy-policy
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
