  mockup_id: M-AUTH-002-S09
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S09__SUCCESS__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-002-S10
  state_code: RATE_LIMITED
  name: 注册限流
  description: 展示重试时间
  introduced_in: V1.0.0
  mockup_id: M-AUTH-002-S10
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-002/M-AUTH-002-S10__RATE_LIMITED__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-002-S11
  state_code: NETWORK_ERROR
  name: 网络错误
