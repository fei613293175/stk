- state_id: SYS-OV-002-S02
  state_code: DOWNLOADING
  name: 强制更新下载中
  description: 不可关闭
  introduced_in: V1.4.0
  mockup_id: M-SYS-OV-002-S02
  mockup_path: ui/mockups/approved/V1.4.0/SYS-OV-002/M-SYS-OV-002-S02__DOWNLOADING__1170x2532.png
