schema_version: 1
page:
  page_id: ME-005
  name: 账户余额展示
  surface: android
  visual_type: PAGE
  route: stk://me/wallets
  introduced_in: V1.3.0
  layout_profile: STANDARD
  parent_page_id: ME-001
  identity_signature: 佣金账户+任务账户+只读说明
  notes: 余额默认 0.00；不实现流水、提现或转账
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: STANDARD
  profile_values:
    top_bar: 56
    bottom_nav: none
    horizontal_padding: 16
    section_gap: 20
    dominant: standard_content
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 佣金账户+任务账户+只读说明
- 余额默认 0.00；不实现流水、提现或转账
required_states:
- state_id: ME-005-S01
  state_code: LOADING
  name: 账户加载
  description: 双卡骨架
  introduced_in: V1.3.0
  mockup_id: M-ME-005-S01
  mockup_path: ui/mockups/approved/V1.3.0/ME-005/M-ME-005-S01__LOADING__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-005-S02
  state_code: CONTENT
  name: 只读余额
  description: 佣金和任务账户真实余额
  introduced_in: V1.3.0
  mockup_id: M-ME-005-S02
  mockup_path: ui/mockups/approved/V1.3.0/ME-005/M-ME-005-S02__CONTENT__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-005-S03
  state_code: ERROR
  name: 账户加载失败
  description: 重试
  introduced_in: V1.3.0
  mockup_id: M-ME-005-S03
  mockup_path: ui/mockups/approved/V1.3.0/ME-005/M-ME-005-S03__ERROR__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-WALLET-001
  feature_id: PROFILE-003
  name: 账户操作说明
  interaction_type: TAP
  test_tag: wallet_action_info
  action: 点击余额卡
  target: 阶段说明
  api_operation_id: LOCAL_STAGE_SCOPE
  introduced_in: V1.3.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-WALLET-002
  feature_id: PROFILE-003
  name: 账户页返回
  interaction_type: TAP
  test_tag: wallet_back
  action: 点击返回
  target: ME-001
  api_operation_id: LOCAL_BACK
  introduced_in: V1.3.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
