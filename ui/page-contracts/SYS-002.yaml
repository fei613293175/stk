schema_version: 1
page:
  page_id: SYS-002
  name: 维护、离线与服务不可用
  surface: android
  visual_type: PAGE
  route: stk://system/unavailable
  introduced_in: V1.0.0
  layout_profile: RESULT
  parent_page_id: null
  identity_signature: 系统状态插图+明确原因+重试/退出
  notes: 不能用空白页或系统异常堆栈
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: RESULT
  profile_values:
    top_bar: 56
    bottom_nav: none
    horizontal_padding: 24
    illustration: 112
    dominant: centered_result
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 系统状态插图+明确原因+重试/退出
- 不能用空白页或系统异常堆栈
required_states:
- state_id: SYS-002-S01
  state_code: MAINTENANCE
  name: 系统维护
  description: 后台配置维护文案和预计恢复说明
  introduced_in: V1.0.0
  mockup_id: M-SYS-002-S01
  mockup_path: ui/mockups/approved/V1.0.0/SYS-002/M-SYS-002-S01__MAINTENANCE__1170x2532.png
  mockup_status: APPROVED
- state_id: SYS-002-S02
  state_code: SERVICE_UNAVAILABLE
  name: 服务不可用
  description: 后端暂时不可用并提供重试
  introduced_in: V1.0.0
  mockup_id: M-SYS-002-S02
  mockup_path: ui/mockups/approved/V1.0.0/SYS-002/M-SYS-002-S02__SERVICE_UNAVAILABLE__1170x2532.png
  mockup_status: APPROVED
- state_id: SYS-002-S03
  state_code: OFFLINE_NO_CACHE
  name: 离线且无缓存
  description: 首次使用无网络，提供检查网络和重试
  introduced_in: V1.0.0
  mockup_id: M-SYS-002-S03
  mockup_path: ui/mockups/approved/V1.0.0/SYS-002/M-SYS-002-S03__OFFLINE_NO_CACHE__1170x2532.png
  mockup_status: APPROVED
- state_id: SYS-002-S04
  state_code: SERVER_ERROR
  name: 系统异常
  description: 服务端错误，显示请求编号供排查
  introduced_in: V1.0.0
  mockup_id: M-SYS-002-S04
  mockup_path: ui/mockups/approved/V1.0.0/SYS-002/M-SYS-002-S04__SERVER_ERROR__1170x2532.png
  mockup_status: APPROVED
- state_id: SYS-002-S05
  state_code: RECOVERED
  name: 服务已恢复
  description: 恢复提示并返回上一安全页面
  introduced_in: V1.4.0
  mockup_id: M-SYS-002-S05
  mockup_path: ui/mockups/approved/V1.4.0/SYS-002/M-SYS-002-S05__RECOVERED__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-SYS-003
  feature_id: FND-002
  name: 服务异常重试
  interaction_type: TAP
  test_tag: system_retry
  action: 点击重试
  target: 上一次安全请求
  api_operation_id: LOCAL_RETRY
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-SYS-004
  feature_id: PROFILE-005
  name: 打开客服
  interaction_type: TAP
  test_tag: system_open_support
  action: 点击联系客服
  target: stk://me/support
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.3.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
