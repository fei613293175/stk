  visual_type: PAGE
  route: stk://auth/login
  introduced_in: V1.0.0
  layout_profile: AUTH
  parent_page_id: null
  identity_signature: 商推客品牌+密码/短信双模式+主登录按钮
  notes: 登录、注册、发送短信均受安全验证码约束
  design_system_version: STK-DS-1.0
