schema_version: 1
page:
  page_id: PUB-004
  name: 编辑项目
  surface: android
  visual_type: PAGE
  route: stk://project/{project_id}/edit
  introduced_in: V1.2.0
  layout_profile: FORM
  parent_page_id: ME-002
  identity_signature: 已有内容表单+审核提示+保存
  notes: 编辑 published 项目默认重新进入审核
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: FORM
  profile_values:
    top_bar: 56
    bottom_nav: none_or_root_publish
    horizontal_padding: 16
    field_gap: 12
    textarea_min: 120
    image_tile: 112
    sticky_action_height: 72
    dominant: project_form
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 已有内容表单+审核提示+保存
- 编辑 published 项目默认重新进入审核
required_states:
- state_id: PUB-004-S01
  state_code: LOADING
  name: 编辑加载
  description: 读取本人项目
  introduced_in: V1.2.0
  mockup_id: M-PUB-004-S01
  mockup_path: ui/mockups/approved/V1.2.0/PUB-004/M-PUB-004-S01__LOADING__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-004-S02
  state_code: CONTENT
  name: 编辑内容
  description: 已填充表单
  introduced_in: V1.2.0
  mockup_id: M-PUB-004-S02
  mockup_path: ui/mockups/approved/V1.2.0/PUB-004/M-PUB-004-S02__CONTENT__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-004-S03
  state_code: REVIEW_WARNING
  name: 重新审核提示
  description: 保存前明确说明
  introduced_in: V1.2.0
  mockup_id: M-PUB-004-S03
  mockup_path: ui/mockups/approved/V1.2.0/PUB-004/M-PUB-004-S03__REVIEW_WARNING__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-004-S04
  state_code: SAVING
  name: 保存中
  description: 幂等提交
  introduced_in: V1.2.0
  mockup_id: M-PUB-004-S04
  mockup_path: ui/mockups/approved/V1.2.0/PUB-004/M-PUB-004-S04__SAVING__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-004-S05
  state_code: SUCCESS
  name: 保存成功
  description: 进入真实状态详情
  introduced_in: V1.2.0
  mockup_id: M-PUB-004-S05
  mockup_path: ui/mockups/approved/V1.2.0/PUB-004/M-PUB-004-S05__SUCCESS__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-004-S06
  state_code: CONFLICT
  name: 版本冲突
  description: 提示刷新后重试
  introduced_in: V1.2.0
  mockup_id: M-PUB-004-S06
  mockup_path: ui/mockups/approved/V1.2.0/PUB-004/M-PUB-004-S06__CONFLICT__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-004-S07
  state_code: UNAVAILABLE
  name: 无权或项目不存在
  description: 返回我的发布
  introduced_in: V1.2.0
  mockup_id: M-PUB-004-S07
  mockup_path: ui/mockups/approved/V1.2.0/PUB-004/M-PUB-004-S07__UNAVAILABLE__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-004-S08
  state_code: NETWORK_ERROR
  name: 保存失败
  description: 保留表单
  introduced_in: V1.2.0
  mockup_id: M-PUB-004-S08
  mockup_path: ui/mockups/approved/V1.2.0/PUB-004/M-PUB-004-S08__NETWORK_ERROR__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-EDIT-001
  feature_id: PUBLISH-003
  name: 保存项目修改
  interaction_type: TAP
  test_tag: project_edit_save
  action: 点击保存
  target: 更新项目
  api_operation_id: updateProject
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-EDIT-002
  feature_id: PUBLISH-003
  name: 编辑页返回
  interaction_type: TAP
  test_tag: project_edit_back
  action: 点击返回
  target: 未保存检查
  api_operation_id: LOCAL_BACK
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
