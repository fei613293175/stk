schema_version: 1
page:
  page_id: COM-OV-001
  name: 受控外部链接确认
  surface: android
  visual_type: OVERLAY
  route: overlay://external-link
  introduced_in: V1.1.0
  layout_profile: OVERLAY
  parent_page_id: null
  identity_signature: 目标服务+域名+风险说明+继续/取消
  notes: 非白名单地址必须阻断
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: OVERLAY
  profile_values:
    top_bar: parent
    bottom_nav: parent
    dialog_width: 326
    scrim: '#00000066'
    dominant: dialog_or_bottom_sheet
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 目标服务+域名+风险说明+继续/取消
- 非白名单地址必须阻断
required_states:
- state_id: COM-OV-001-S01
  state_code: ALLOWED
  name: 白名单外链确认
  description: 显示目标服务和域名
  introduced_in: V1.1.0
  mockup_id: M-COM-OV-001-S01
  mockup_path: ui/mockups/approved/V1.1.0/COM-OV-001/M-COM-OV-001-S01__ALLOWED__1170x2532.png
  mockup_status: APPROVED
- state_id: COM-OV-001-S02
  state_code: BLOCKED
  name: 外链被阻断
  description: 非白名单地址不可继续
  introduced_in: V1.1.0
  mockup_id: M-COM-OV-001-S02
  mockup_path: ui/mockups/approved/V1.1.0/COM-OV-001/M-COM-OV-001-S02__BLOCKED__1170x2532.png
  mockup_status: APPROVED
- state_id: COM-OV-001-S03
  state_code: APP_UNAVAILABLE
  name: 目标应用未安装
  description: 提供浏览器或复制回退
  introduced_in: V1.1.0
  mockup_id: M-COM-OV-001-S03
  mockup_path: ui/mockups/approved/V1.1.0/COM-OV-001/M-COM-OV-001-S03__APP_UNAVAILABLE__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-EXT-001
  feature_id: HOME-005
  name: 确认打开白名单外链
  interaction_type: TAP
  test_tag: external_continue
  action: 点击继续
  target: Custom Tabs 或目标 App
  api_operation_id: LOCAL_EXTERNAL_OPEN
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-EXT-002
  feature_id: HOME-005
  name: 取消外部跳转
  interaction_type: TAP
  test_tag: external_cancel
  action: 点击取消
  target: 关闭弹层
  api_operation_id: LOCAL_DISMISS
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
