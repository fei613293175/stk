schema_version: 1
page:
  page_id: HOME-003
  name: 项目分类筛选
  surface: android
  visual_type: OVERLAY
  route: overlay://categories
  introduced_in: V1.1.0
  layout_profile: OVERLAY
  parent_page_id: HOME-001
  identity_signature: 分类列表+当前选中+确认/重置
  notes: 分类排序和可见性由后台控制
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: OVERLAY
  profile_values:
    top_bar: parent
    bottom_nav: parent
    dialog_width: 326
    scrim: '#00000066'
    dominant: dialog_or_bottom_sheet
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 分类列表+当前选中+确认/重置
- 分类排序和可见性由后台控制
required_states:
- state_id: HOME-003-S01
  state_code: DEFAULT
  name: 分类列表
  description: 全部分类和当前选择
  introduced_in: V1.1.0
  mockup_id: M-HOME-003-S01
  mockup_path: ui/mockups/approved/V1.1.0/HOME-003/M-HOME-003-S01__DEFAULT__1170x2532.png
  mockup_status: APPROVED
- state_id: HOME-003-S02
  state_code: SELECTED
  name: 选中分类
  description: 高亮并允许确认
  introduced_in: V1.1.0
  mockup_id: M-HOME-003-S02
  mockup_path: ui/mockups/approved/V1.1.0/HOME-003/M-HOME-003-S02__SELECTED__1170x2532.png
  mockup_status: APPROVED
- state_id: HOME-003-S03
  state_code: EMPTY
  name: 无可用分类
  description: 只保留全部
  introduced_in: V1.1.0
  mockup_id: M-HOME-003-S03
  mockup_path: ui/mockups/approved/V1.1.0/HOME-003/M-HOME-003-S03__EMPTY__1170x2532.png
  mockup_status: APPROVED
- state_id: HOME-003-S04
  state_code: ERROR
  name: 分类加载失败
  description: 使用缓存或重试
  introduced_in: V1.1.0
  mockup_id: M-HOME-003-S04
  mockup_path: ui/mockups/approved/V1.1.0/HOME-003/M-HOME-003-S04__ERROR__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-CAT-001
  feature_id: HOME-002
  name: 选择分类
  interaction_type: TAP
  test_tag: category_{categoryId}
  action: 点击分类
  target: 选中状态
  api_operation_id: LOCAL_UI_STATE
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-CAT-002
  feature_id: HOME-002
  name: 确认分类
  interaction_type: TAP
  test_tag: category_confirm
  action: 点击确认
  target: 筛选首页
  api_operation_id: listProjects
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-CAT-003
  feature_id: HOME-002
  name: 重置分类
  interaction_type: TAP
  test_tag: category_reset
  action: 点击重置
  target: 全部分类
  api_operation_id: LOCAL_UI_STATE
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-CAT-004
  feature_id: HOME-002
  name: 关闭分类
  interaction_type: TAP
  test_tag: category_close
  action: 点击关闭
  target: 关闭面板
  api_operation_id: LOCAL_DISMISS
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
