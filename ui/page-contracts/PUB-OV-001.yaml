schema_version: 1
page:
  page_id: PUB-OV-001
  name: 删除图片确认
  surface: android
  visual_type: OVERLAY
  route: overlay://delete-image
  introduced_in: V1.2.0
  layout_profile: OVERLAY
  parent_page_id: PUB-001
  identity_signature: 缩略图+删除说明+取消/删除
  notes: 删除未绑定项目的上传资产也需服务端鉴权
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: OVERLAY
  profile_values:
    top_bar: parent
    bottom_nav: parent
    dialog_width: 326
    scrim: '#00000066'
    dominant: dialog_or_bottom_sheet
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 缩略图+删除说明+取消/删除
- 删除未绑定项目的上传资产也需服务端鉴权
required_states:
- state_id: PUB-OV-001-S01
  state_code: DEFAULT
  name: 确认删除图片
  description: 取消或删除
  introduced_in: V1.2.0
  mockup_id: M-PUB-OV-001-S01
  mockup_path: ui/mockups/approved/V1.2.0/PUB-OV-001/M-PUB-OV-001-S01__DEFAULT__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-OV-001-S02
  state_code: DELETING
  name: 删除中
  description: 按钮锁定
  introduced_in: V1.2.0
  mockup_id: M-PUB-OV-001-S02
  mockup_path: ui/mockups/approved/V1.2.0/PUB-OV-001/M-PUB-OV-001-S02__DELETING__1170x2532.png
  mockup_status: APPROVED
- state_id: PUB-OV-001-S03
  state_code: FAILED
  name: 删除失败
  description: 允许重试
  introduced_in: V1.2.0
  mockup_id: M-PUB-OV-001-S03
  mockup_path: ui/mockups/approved/V1.2.0/PUB-OV-001/M-PUB-OV-001-S03__FAILED__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-DELIMG-001
  feature_id: PUBLISH-001
  name: 确认删除图片
  interaction_type: TAP
  test_tag: delete_image_confirm
  action: 点击删除
  target: 删除上传资产
  api_operation_id: deleteUploadedImage
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-DELIMG-002
  feature_id: PUBLISH-001
  name: 取消删除图片
  interaction_type: TAP
  test_tag: delete_image_cancel
  action: 点击取消
  target: 关闭弹层
  api_operation_id: LOCAL_DISMISS
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
