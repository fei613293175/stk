schema_version: 1
page:
  page_id: HOME-001
  name: 首页项目流
  surface: android
  visual_type: PAGE
  route: stk://home
  introduced_in: V1.0.0
  layout_profile: ROOT_FEED
  parent_page_id: null
  identity_signature: 品牌顶部栏+搜索+分类+单列项目卡+底部导航
  notes: 首页只展示 published 项目
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: ROOT_FEED
  profile_values:
    top_bar: 56
    bottom_nav: 64
    horizontal_padding: 16
    search_height: 44
    list_gap: 12
    dominant: single_column_project_feed
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 品牌顶部栏+搜索+分类+单列项目卡+底部导航
- 首页只展示 published 项目
