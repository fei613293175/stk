allowed_interactions:
- interaction_id: INT-NAV-001
  feature_id: FND-001
  name: 底部导航进入首页
  interaction_type: TAP
  test_tag: nav_home
  action: 点击首页
  target: stk://home
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.0.0
  expected_result: 进入首页并保留或恢复滚动位置；在首页再次点击回到顶部
- interaction_id: INT-NAV-002
  feature_id: FND-001
  name: 底部导航进入发布
  interaction_type: TAP
  test_tag: nav_publish
  action: 点击发布
  target: 版本化路由
  api_operation_id: LOCAL_VERSIONED_NAVIGATION
  introduced_in: V1.0.0
  expected_result: V1.0/V1.1 打开阶段说明；V1.2 起进入 PUB-001
- interaction_id: INT-NAV-003
  feature_id: FND-001
  name: 底部导航进入我的
  interaction_type: TAP
  test_tag: nav_me
  action: 点击我的
  target: stk://me
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.0.0
  expected_result: 进入我的页面并保留首页状态
- interaction_id: INT-HOME-001
  feature_id: HOME-001
  name: 下拉刷新项目流
  interaction_type: SWIPE
  test_tag: home_pull_refresh
  action: 下拉刷新
  target: 最新游标
  api_operation_id: listProjects
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-HOME-002
  feature_id: HOME-002
  name: 打开搜索
  interaction_type: TAP
  test_tag: home_search
  action: 点击搜索框
  target: stk://search
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-HOME-003
  feature_id: HOME-002
  name: 打开分类筛选
  interaction_type: TAP
  test_tag: home_category_filter
  action: 点击分类
  target: HOME-003
  api_operation_id: LOCAL_OVERLAY
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-HOME-004
  feature_id: HOME-003
  name: 打开项目详情
  interaction_type: TAP
  test_tag: project_card_{projectId}
  action: 点击项目卡
  target: stk://project/{project_id}
  api_operation_id: getProjectDetail
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-HOME-005
  feature_id: HOME-001
  name: 下一页自动加载
  interaction_type: SCROLL
  test_tag: home_project_list
  action: 滚动接近底部
  target: 下一游标
  api_operation_id: listProjects
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-HOME-006
  feature_id: HOME-001
  name: 重试首屏
  interaction_type: TAP
  test_tag: home_retry
  action: 点击重试
  target: 项目流
  api_operation_id: listProjects
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-HOME-007
  feature_id: HOME-001
  name: 重试下一页
  interaction_type: TAP
  test_tag: home_load_more_retry
  action: 点击重试
  target: 下一游标
  api_operation_id: listProjects
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-HOME-008
  feature_id: PROFILE-001
  name: 顶部头像进入我的
  interaction_type: TAP
  test_tag: home_avatar
  action: 点击头像
  target: stk://me
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
