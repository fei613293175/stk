  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: LEGAL
  profile_values:
    top_bar: 56
    bottom_nav: none
    horizontal_padding: 16
    content_bottom_padding: 32
    dominant: scrolling_legal_text
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 固定标题+版本日期+协议正文
- 内容来自受版本管理的后台协议配置
required_states:
- state_id: AUTH-004-S01
  state_code: LOADING
  name: 协议加载
  description: 读取版本化协议
  introduced_in: V1.0.0
  mockup_id: M-AUTH-004-S01
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-004/M-AUTH-004-S01__LOADING__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-004-S02
  state_code: CONTENT
  name: 协议正文
  description: 显示完整正文和生效日期
  introduced_in: V1.0.0
  mockup_id: M-AUTH-004-S02
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-004/M-AUTH-004-S02__CONTENT__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-004-S03
  state_code: OFFLINE_CACHED
  name: 离线缓存
  description: 显示已缓存版本和离线标识
  introduced_in: V1.0.0
  mockup_id: M-AUTH-004-S03
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-004/M-AUTH-004-S03__OFFLINE_CACHED__1170x2532.png
  mockup_status: APPROVED
- state_id: AUTH-004-S04
  state_code: ERROR
  name: 加载失败
  description: 重试
  introduced_in: V1.0.0
  mockup_id: M-AUTH-004-S04
  mockup_path: ui/mockups/approved/V1.0.0/AUTH-004/M-AUTH-004-S04__ERROR__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-LEGAL-001
  feature_id: AUTH-007
  name: 用户协议返回
  interaction_type: TAP
  test_tag: agreement_back
  action: 点击返回
  target: 上一页
  api_operation_id: LOCAL_BACK
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-LEGAL-002
  feature_id: AUTH-007
  name: 重试加载用户协议
  interaction_type: TAP
  test_tag: agreement_retry
  action: 点击重试
  target: 协议服务
  api_operation_id: getLegalDocument
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
