  name: 用户协议
  surface: android
  visual_type: PAGE
  route: stk://legal/user-agreement
  introduced_in: V1.0.0
  layout_profile: LEGAL
  parent_page_id: null
  identity_signature: 固定标题+版本日期+协议正文
  notes: 内容来自受版本管理的后台协议配置
  design_system_version: STK-DS-1.0
