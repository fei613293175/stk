allowed_interactions:
- interaction_id: INT-MYPROJ-001
  feature_id: PUBLISH-004
  name: 切换项目状态标签
  interaction_type: TAP
  test_tag: my_projects_tab_{status}
  action: 点击状态标签
  target: 本人项目列表
  api_operation_id: listMyProjects
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-MYPROJ-002
  feature_id: PUBLISH-004
  name: 打开本人项目详情
  interaction_type: TAP
  test_tag: my_project_{projectId}
  action: 点击项目
  target: HOME-004
  api_operation_id: getProjectDetail
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-MYPROJ-003
  feature_id: PUBLISH-004
  name: 打开项目操作面板
  interaction_type: TAP
  test_tag: my_project_more_{projectId}
  action: 点击更多
  target: ME-OV-002
  api_operation_id: LOCAL_OVERLAY
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-MYPROJ-004
  feature_id: PUBLISH-004
  name: 我的项目加载更多
  interaction_type: SCROLL
  test_tag: my_projects_list
  action: 滚动到底部
  target: 下一游标
  api_operation_id: listMyProjects
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-MYPROJ-005
  feature_id: PUBLISH-004
  name: 我的项目重试
  interaction_type: TAP
  test_tag: my_projects_retry
  action: 点击重试
  target: 本人项目列表
  api_operation_id: listMyProjects
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-MYPROJ-006
  feature_id: PUBLISH-002
  name: 空列表去发布
  interaction_type: TAP
  test_tag: my_projects_publish
  action: 点击发布项目
  target: PUB-001
  api_operation_id: LOCAL_NAVIGATION
  introduced_in: V1.2.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
