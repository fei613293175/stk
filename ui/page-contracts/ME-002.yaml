schema_version: 1
page:
  page_id: ME-002
  name: 我的发布
  surface: android
  visual_type: PAGE
  route: stk://me/projects
  introduced_in: V1.2.0
  layout_profile: LIST
  parent_page_id: ME-001
  identity_signature: 状态标签页+本人项目列表+项目操作
  notes: 只能操作本人项目
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
