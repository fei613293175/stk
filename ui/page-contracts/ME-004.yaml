  introduced_in: V1.3.0
  mockup_id: M-ME-004-S03
  mockup_path: ui/mockups/approved/V1.3.0/ME-004/M-ME-004-S03__ACTIVE__1170x2532.png
  mockup_status: APPROVED
- state_id: ME-004-S04
  state_code: EXPIRED
  name: 已过期
  description: 历史状态和到期日期
  introduced_in: V1.3.0
  mockup_id: M-ME-004-S04
