  visual_type: PAGE
  route: stk://me/member
  introduced_in: V1.3.0
  layout_profile: STANDARD
  parent_page_id: ME-001
  identity_signature: 会员卡+权益说明+状态+有效期
  notes: 不实现在线支付、折扣或返佣结算
  design_system_version: STK-DS-1.0
