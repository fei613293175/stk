  mockup_status: APPROVED
- state_id: ME-004-S02
  state_code: INACTIVE
  name: 未开通
  description: 展示后台配置权益与阶段提示
  introduced_in: V1.3.0
  mockup_id: M-ME-004-S02
  mockup_path: ui/mockups/approved/V1.3.0/ME-004/M-ME-004-S02__INACTIVE__1170x2532.png
