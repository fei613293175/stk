- state_id: ME-004-S05
  state_code: ERROR
  name: 会员加载失败
  description: 重试
  introduced_in: V1.3.0
  mockup_id: M-ME-004-S05
  mockup_path: ui/mockups/approved/V1.3.0/ME-004/M-ME-004-S05__ERROR__1170x2532.png
