allowed_interactions:
- interaction_id: INT-CAPTCHA-001
  feature_id: AUTH-004
  name: 输入安全验证码
  interaction_type: INPUT
  test_tag: captcha_input
  action: 输入验证码
  target: 验证码字段
  api_operation_id: LOCAL_VALIDATION
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-CAPTCHA-002
  feature_id: AUTH-004
  name: 刷新安全验证码
  interaction_type: TAP
  test_tag: captcha_refresh
  action: 点击刷新
  target: 新 challenge
  api_operation_id: getCaptchaChallenge
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-CAPTCHA-003
  feature_id: AUTH-004
  name: 确认安全验证码
  interaction_type: TAP
  test_tag: captcha_confirm
  action: 点击确认
  target: 一次性 ticket
  api_operation_id: verifyCaptcha
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-CAPTCHA-004
  feature_id: AUTH-004
  name: 取消安全验证码
  interaction_type: TAP
  test_tag: captcha_cancel
  action: 点击取消
  target: 关闭弹窗
  api_operation_id: LOCAL_DISMISS
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
