schema_version: 1
page:
  page_id: HOME-002
  name: 项目搜索
  surface: android
  visual_type: PAGE
  route: stk://search
  introduced_in: V1.1.0
  layout_profile: SEARCH
  parent_page_id: null
  identity_signature: 搜索输入+结果统计+项目列表
  notes: 不在一期保存个人搜索历史
  design_system_version: STK-DS-1.0
  functional_authority: contracts/feature-map.yaml
  visual_authority: contracts/mockup-manifest.csv
  sample_content_is_not_functional_scope: true
fixed_layout:
  profile: SEARCH
  profile_values:
    top_bar: 56
    bottom_nav: none
    horizontal_padding: 16
    search_height: 44
    list_gap: 12
    dominant: search_results
  global_token_authority: contracts/ui-design-tokens.yaml
  page_matrix_authority: contracts/ui-page-layout-matrix.csv
required_identity:
- 搜索输入+结果统计+项目列表
- 不在一期保存个人搜索历史
