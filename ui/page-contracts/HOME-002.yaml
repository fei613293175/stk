allowed_interactions:
- interaction_id: INT-SEARCH-001
  feature_id: HOME-002
  name: 输入搜索关键词
  interaction_type: INPUT
  test_tag: search_query
  action: 输入关键词
  target: 搜索字段
  api_operation_id: LOCAL_DEBOUNCE
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-SEARCH-002
  feature_id: HOME-002
  name: 提交搜索
  interaction_type: IME_ACTION
  test_tag: search_submit
  action: 键盘搜索
  target: 搜索 API
  api_operation_id: listProjects
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-SEARCH-003
  feature_id: HOME-002
  name: 清空搜索
  interaction_type: TAP
  test_tag: search_clear
  action: 点击清除
  target: 默认搜索页
  api_operation_id: LOCAL_UI_STATE
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-SEARCH-004
  feature_id: HOME-003
  name: 打开搜索结果详情
  interaction_type: TAP
  test_tag: search_project_{projectId}
  action: 点击项目
  target: stk://project/{project_id}
  api_operation_id: getProjectDetail
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-SEARCH-005
  feature_id: HOME-002
  name: 搜索重试
  interaction_type: TAP
  test_tag: search_retry
  action: 点击重试
  target: 搜索 API
  api_operation_id: listProjects
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
- interaction_id: INT-SEARCH-006
  feature_id: HOME-002
  name: 返回首页
  interaction_type: TAP
  test_tag: search_back
  action: 点击返回
  target: stk://home
  api_operation_id: LOCAL_BACK
  introduced_in: V1.1.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
