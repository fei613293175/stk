- state_id: HOME-002-S01
  state_code: DEFAULT
  name: 搜索默认
  description: 空关键词和提示
  introduced_in: V1.1.0
  mockup_id: M-HOME-002-S01
  mockup_path: ui/mockups/approved/V1.1.0/HOME-002/M-HOME-002-S01__DEFAULT__1170x2532.png
  mockup_status: APPROVED
- state_id: HOME-002-S02
  state_code: TYPING
  name: 输入中
  description: 清除按钮和键盘
  introduced_in: V1.1.0
  mockup_id: M-HOME-002-S02
  mockup_path: ui/mockups/approved/V1.1.0/HOME-002/M-HOME-002-S02__TYPING__1170x2532.png
  mockup_status: APPROVED
- state_id: HOME-002-S03
  state_code: LOADING
  name: 搜索中
  description: 结果骨架
  introduced_in: V1.1.0
  mockup_id: M-HOME-002-S03
  mockup_path: ui/mockups/approved/V1.1.0/HOME-002/M-HOME-002-S03__LOADING__1170x2532.png
  mockup_status: APPROVED
- state_id: HOME-002-S04
  state_code: RESULTS
  name: 有结果
