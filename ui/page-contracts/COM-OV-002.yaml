  mockup_id: M-COM-OV-002-S01
  mockup_path: ui/mockups/approved/V1.0.0/COM-OV-002/M-COM-OV-002-S01__PUBLISH_STAGE__1170x2532.png
  mockup_status: APPROVED
- state_id: COM-OV-002-S02
  state_code: MEMBER_STAGE
  name: 会员在线开通未开放
  description: 只展示会员状态和权益
  introduced_in: V1.3.0
  mockup_id: M-COM-OV-002-S02
  mockup_path: ui/mockups/approved/V1.3.0/COM-OV-002/M-COM-OV-002-S02__MEMBER_STAGE__1170x2532.png
  mockup_status: APPROVED
- state_id: COM-OV-002-S03
  state_code: WALLET_STAGE
  name: 账户操作未开放
  description: 只展示余额
  introduced_in: V1.3.0
  mockup_id: M-COM-OV-002-S03
  mockup_path: ui/mockups/approved/V1.3.0/COM-OV-002/M-COM-OV-002-S03__WALLET_STAGE__1170x2532.png
  mockup_status: APPROVED
- state_id: COM-OV-002-S04
  state_code: PROP_STAGE
  name: 道具购买未开放
  description: 只展示道具
  introduced_in: V1.3.0
  mockup_id: M-COM-OV-002-S04
  mockup_path: ui/mockups/approved/V1.3.0/COM-OV-002/M-COM-OV-002-S04__PROP_STAGE__1170x2532.png
  mockup_status: APPROVED
allowed_interactions:
- interaction_id: INT-STAGE-001
  feature_id: FND-001
  name: 关闭阶段说明
  interaction_type: TAP
  test_tag: stage_scope_close
  action: 点击返回
  target: 关闭弹层
  api_operation_id: LOCAL_DISMISS
  introduced_in: V1.0.0
  expected_result: 产生合同规定的唯一结果
content_authority: ui/FIXTURE_DATA.yaml for visual tests; runtime data from contracted APIs
forbidden:
- page-local arbitrary colors/dp/sp/radius
- function not listed in allowed_interactions
- remote HTML layout
- sample text treated as feature
- empty click target
- unapproved mockup used as final baseline
acceptance:
  canonical: 390x844dp / 1170x2532px
  responsive_widths_dp:
  - 360
  - 390
  - 412
  - 430
  visual_diff: approved baseline required
  accessibility: 48dp touch targets and content descriptions
