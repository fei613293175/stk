schema_version: 1
authority: contracts/api-inventory.csv
operations:
- operation_id: getBootstrap
  method: GET
  path: /v1/bootstrap
  plugin: stk_auth
  feature_id: FND-002
  introduced_in: V1.0.0
  auth: OPTIONAL_BEARER
  request_contract: 'headers: app_version,version_code,device_id,locale'
  success_response_contract: maintenance,auth_state,feature_flags,legal_versions,external_link_policy,release_policy
  error_codes: SYS_MAINTENANCE|AUTH_TOKEN_EXPIRED|SYS_UNAVAILABLE
  idempotency: N/A
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: getCaptchaChallenge
  method: POST
  path: /v1/auth/captcha/challenges
  plugin: stk_auth
  feature_id: AUTH-004
  introduced_in: V1.0.0
  auth: ANONYMOUS
  request_contract: action,password_login|sms_send|sms_login|register|password_reset; device_id
  success_response_contract: challenge_id,image_base64_or_url,expires_in
  error_codes: CAPTCHA_RATE_LIMITED|CAPTCHA_UNAVAILABLE
  idempotency: Idempotency-Key optional
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: verifyCaptcha
  method: POST
  path: /v1/auth/captcha/verify
  plugin: stk_auth
  feature_id: AUTH-004
  introduced_in: V1.0.0
  auth: ANONYMOUS
  request_contract: challenge_id,answer,action,device_id
  success_response_contract: captcha_ticket,ticket_expires_in
  error_codes: CAPTCHA_INVALID|CAPTCHA_EXPIRED|CAPTCHA_ATTEMPTS_EXCEEDED
  idempotency: challenge one-use
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: sendSmsCode
  method: POST
  path: /v1/auth/sms/send
  plugin: stk_auth
  feature_id: AUTH-002
  introduced_in: V1.0.0
  auth: ANONYMOUS
  request_contract: mobile,scene=login|password_reset,captcha_ticket,device_id
  success_response_contract: request_id,resend_after,expires_in,masked_mobile
  error_codes: SMS_RATE_LIMITED|SMS_PROVIDER_FAILED|SMS_SCENE_DISABLED|CAPTCHA_TICKET_INVALID
  idempotency: Idempotency-Key required
  rate_limit: 手机号+IP+设备+场景四维限流
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: loginWithPassword
  method: POST
  path: /v1/auth/login/password
  plugin: stk_auth
  feature_id: AUTH-001
  introduced_in: V1.0.0
  auth: ANONYMOUS
  request_contract: mobile,password,captcha_ticket,device_id,device_name
  success_response_contract: access_token,access_expires_in,refresh_token,refresh_expires_in,user,next_route
  error_codes: AUTH_INVALID_CREDENTIALS|AUTH_ACCOUNT_BLOCKED|CAPTCHA_TICKET_INVALID
  idempotency: Idempotency-Key required
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: loginWithSms
  method: POST
  path: /v1/auth/login/sms
  plugin: stk_auth
  feature_id: AUTH-002
  introduced_in: V1.0.0
  auth: ANONYMOUS
  request_contract: mobile,sms_code,captcha_ticket,device_id,device_name
  success_response_contract: access_token,access_expires_in,refresh_token,refresh_expires_in,user,next_route
  error_codes: SMS_CODE_INVALID|SMS_CODE_EXPIRED|AUTH_ACCOUNT_BLOCKED|CAPTCHA_TICKET_INVALID
  idempotency: Idempotency-Key required
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: registerUser
  method: POST
  path: /v1/auth/register
  plugin: stk_auth
  feature_id: AUTH-003
  introduced_in: V1.0.0
  auth: ANONYMOUS
  request_contract: mobile,password,password_confirmation,agreement_version,privacy_version,captcha_ticket,device_id
  success_response_contract: uid,username,display_name,masked_mobile,mobile_verified=false,tokens,next_route
  error_codes: AUTH_MOBILE_EXISTS|AUTH_PASSWORD_WEAK|LEGAL_VERSION_STALE|CAPTCHA_TICKET_INVALID
  idempotency: Idempotency-Key required
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: resetPassword
  method: POST
  path: /v1/auth/password/reset
  plugin: stk_auth
  feature_id: AUTH-005
  introduced_in: V1.0.0
  auth: ANONYMOUS
  request_contract: mobile,sms_code,new_password,password_confirmation,captcha_ticket,device_id
  success_response_contract: reset=true,next_route
  error_codes: SMS_CODE_INVALID|SMS_CODE_EXPIRED|AUTH_PASSWORD_WEAK|CAPTCHA_TICKET_INVALID
  idempotency: Idempotency-Key required
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: refreshToken
  method: POST
  path: /v1/auth/token/refresh
  plugin: stk_auth
  feature_id: AUTH-006
  introduced_in: V1.0.0
  auth: REFRESH_TOKEN
  request_contract: refresh_token,device_id
  success_response_contract: rotated access_token and refresh_token
  error_codes: AUTH_REFRESH_INVALID|AUTH_TOKEN_REUSED|AUTH_ACCOUNT_BLOCKED
  idempotency: refresh token rotates atomically
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: logout
  method: POST
  path: /v1/auth/logout
  plugin: stk_auth
  feature_id: AUTH-006
  introduced_in: V1.0.0
  auth: BEARER
  request_contract: refresh_token_family,device_id
  success_response_contract: revoked=true
  error_codes: AUTH_TOKEN_INVALID
  idempotency: Idempotency-Key required
  rate_limit: 按全局与场景策略
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
- operation_id: getMySummary
  method: GET
  path: /v1/me/summary
  plugin: stk_auth
  feature_id: PROFILE-001
  introduced_in: V1.0.0
  auth: BEARER
  request_contract: none
