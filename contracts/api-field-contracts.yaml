  error_codes: UPLOAD_TOO_LARGE|UPLOAD_TYPE_INVALID|UPLOAD_IMAGE_INVALID|UPLOAD_QUOTA_EXCEEDED
  idempotency: Idempotency-Key required
  rate_limit: 每用户上传并发2、会话与日配额
  transport: HTTPS JSON UTF-8
  response_envelope: code,message,data,request_id,server_time
