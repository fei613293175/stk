schema_version: 1
errors:
- error_code: SYS_UNAVAILABLE
  http_status: 503
  user_message: 服务暂不可用
  client_behavior: 显示 SYS-002 并允许安全重试
  introduced_in: V1.0.0
  log_level: ERROR
  retryable: 'true'
- error_code: SYS_MAINTENANCE
  http_status: 503
  user_message: 系统维护中
  client_behavior: 显示维护状态，不继续写操作
  introduced_in: V1.4.0
  log_level: ERROR
  retryable: 'true'
- error_code: SYS_DEPENDENCY_UNREADY
  http_status: 503
  user_message: 依赖未就绪
  client_behavior: 仅用于健康检查和后台诊断
  introduced_in: V1.0.0
  log_level: ERROR
  retryable: 'true'
- error_code: SYS_REQUEST_INVALID
  http_status: 400
  user_message: 请求参数错误
  client_behavior: 定位到具体字段，不暴露内部结构
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: SYS_RATE_LIMITED
  http_status: 429
  user_message: 请求过于频繁
  client_behavior: 显示 retry_after
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'true'
- error_code: AUTH_INVALID_CREDENTIALS
  http_status: 401
  user_message: 手机号或密码错误
  client_behavior: 统一文案防账户枚举
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: AUTH_MOBILE_EXISTS
  http_status: 409
  user_message: 手机号已注册
  client_behavior: 引导登录或找回密码
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: AUTH_PASSWORD_WEAK
  http_status: 422
  user_message: 密码不符合规则
  client_behavior: 显示密码规则
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: AUTH_ACCOUNT_BLOCKED
  http_status: 403
  user_message: 账号暂不可用
  client_behavior: 显示风控提示和客服入口
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: AUTH_TOKEN_INVALID
  http_status: 401
  user_message: 登录凭证无效
  client_behavior: 尝试刷新或回登录
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: AUTH_TOKEN_EXPIRED
  http_status: 401
  user_message: 登录已过期
  client_behavior: 刷新失败后回登录
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: AUTH_REFRESH_INVALID
  http_status: 401
  user_message: 刷新凭证无效
  client_behavior: 清理令牌并回登录
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: AUTH_TOKEN_REUSED
  http_status: 401
  user_message: 检测到刷新令牌重放
  client_behavior: 撤销整个令牌族并回登录
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: AUTH_DEVICE_LIMIT
  http_status: 409
  user_message: 登录设备达到上限
  client_behavior: 提示在后台或设备管理撤销
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: CAPTCHA_INVALID
  http_status: 422
  user_message: 安全验证码错误
  client_behavior: 保留弹窗并减少剩余次数
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: CAPTCHA_EXPIRED
  http_status: 410
  user_message: 安全验证码已过期
  client_behavior: 刷新 challenge
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: CAPTCHA_ATTEMPTS_EXCEEDED
  http_status: 429
  user_message: 安全验证码错误次数过多
  client_behavior: 作废 challenge 并限流
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'true'
- error_code: CAPTCHA_TICKET_INVALID
  http_status: 422
  user_message: 安全验证票据无效
  client_behavior: 重新弹出验证码
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: CAPTCHA_RATE_LIMITED
  http_status: 429
  user_message: 验证码请求过于频繁
  client_behavior: 显示重试时间
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'true'
- error_code: CAPTCHA_UNAVAILABLE
  http_status: 503
  user_message: 安全验证码服务不可用
  client_behavior: 阻断敏感操作并重试
  introduced_in: V1.0.0
  log_level: ERROR
  retryable: 'true'
- error_code: SMS_RATE_LIMITED
  http_status: 429
  user_message: 短信发送过于频繁
  client_behavior: 显示 resend_after
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'true'
- error_code: SMS_PROVIDER_FAILED
  http_status: 502
  user_message: 短信服务商发送失败
  client_behavior: 保留手机号并允许稍后重试
  introduced_in: V1.0.0
  log_level: ERROR
  retryable: 'true'
- error_code: SMS_SCENE_DISABLED
  http_status: 403
  user_message: 该短信场景已关闭
  client_behavior: 隐藏或禁用对应入口
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: SMS_CODE_INVALID
  http_status: 422
  user_message: 短信验证码错误
  client_behavior: 保留手机号，记录失败次数
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: SMS_CODE_EXPIRED
  http_status: 410
  user_message: 短信验证码已过期
  client_behavior: 提示重新发送
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: LEGAL_NOT_FOUND
  http_status: 404
  user_message: 协议内容不存在
  client_behavior: 显示错误并阻断注册提交
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: LEGAL_VERSION_STALE
  http_status: 409
  user_message: 协议版本已更新
  client_behavior: 刷新协议版本并重新确认
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_QUERY_INVALID
  http_status: 422
  user_message: 项目查询条件无效
  client_behavior: 恢复默认筛选
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_SERVICE_UNAVAILABLE
  http_status: 503
  user_message: 项目服务不可用
  client_behavior: 显示缓存或重试
  introduced_in: V1.0.0
  log_level: ERROR
  retryable: 'true'
- error_code: PROJECT_CATEGORY_UNAVAILABLE
  http_status: 503
  user_message: 分类不可用
  client_behavior: 回退到全部分类
  introduced_in: V1.0.0
  log_level: ERROR
  retryable: 'true'
- error_code: PROJECT_NOT_FOUND
  http_status: 404
  user_message: 项目不存在
  client_behavior: 返回首页或我的发布
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_NOT_VISIBLE
  http_status: 403
  user_message: 项目当前不可查看
  client_behavior: 非本人不暴露审核信息
  introduced_in: V1.0.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_VALIDATION_FAILED
  http_status: 422
  user_message: 项目信息不符合规则
  client_behavior: 逐字段显示错误
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_DAILY_LIMIT
  http_status: 429
  user_message: 达到每日发布上限
  client_behavior: 显示后台配置上限
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'true'
- error_code: PROJECT_PENDING_LIMIT
  http_status: 409
  user_message: 待审核项目达到上限
  client_behavior: 引导管理已有项目
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_DUPLICATE_SUBMISSION
  http_status: 409
  user_message: 检测到重复提交
  client_behavior: 返回首次提交结果
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_NOT_OWNER
  http_status: 403
  user_message: 无权操作该项目
  client_behavior: 关闭操作并刷新列表
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_STATE_INVALID
  http_status: 409
  user_message: 当前状态不允许该操作
  client_behavior: 刷新项目真实状态
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: PROJECT_CONFLICT
  http_status: 409
  user_message: 项目已被更新
  client_behavior: 刷新后重新编辑
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: UPLOAD_TOO_LARGE
  http_status: 413
  user_message: 图片体积过大
  client_behavior: 提示压缩或重新选择
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: UPLOAD_TYPE_INVALID
  http_status: 415
  user_message: 图片格式不支持
  client_behavior: 显示允许格式
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: UPLOAD_IMAGE_INVALID
  http_status: 422
  user_message: 图片文件无效
  client_behavior: 删除该项并重新选择
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: UPLOAD_QUOTA_EXCEEDED
  http_status: 429
  user_message: 图片上传配额达到上限
  client_behavior: 显示限制
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'true'
- error_code: UPLOAD_NOT_FOUND
  http_status: 404
  user_message: 上传图片不存在
  client_behavior: 刷新上传列表
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: UPLOAD_NOT_OWNER
  http_status: 403
  user_message: 无权操作上传图片
  client_behavior: 阻断并记录安全事件
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: UPLOAD_ALREADY_ATTACHED
  http_status: 409
  user_message: 图片已绑定项目
  client_behavior: 只能通过项目编辑解除
  introduced_in: V1.2.0
  log_level: WARN
  retryable: 'false'
- error_code: MEMBER_UNAVAILABLE
  http_status: 503
  user_message: 会员状态暂不可用
  client_behavior: 保留资料卡并局部重试
  introduced_in: V1.3.0
  log_level: ERROR
  retryable: 'true'
- error_code: WALLET_UNAVAILABLE
  http_status: 503
  user_message: 账户余额暂不可用
  client_behavior: 不显示假余额，局部重试
  introduced_in: V1.3.0
  log_level: ERROR
  retryable: 'true'
- error_code: PROP_CONFIG_UNAVAILABLE
  http_status: 503
  user_message: 道具配置暂不可用
  client_behavior: 显示空状态或缓存
  introduced_in: V1.3.0
  log_level: ERROR
  retryable: 'true'
- error_code: SUPPORT_CONFIG_UNAVAILABLE
  http_status: 503
  user_message: 客服配置暂不可用
  client_behavior: 提供重试，不生成虚假联系方式
  introduced_in: V1.3.0
  log_level: ERROR
  retryable: 'true'
- error_code: RELEASE_CONFIG_INVALID
  http_status: 503
  user_message: 版本发布配置无效
  client_behavior: 不下载未知 APK，记录后台诊断
  introduced_in: V1.4.0
  log_level: ERROR
  retryable: 'true'
- error_code: APP_LINK_UNSUPPORTED
  http_status: 404
  user_message: 链接无法在 App 中打开
  client_behavior: 使用安全 fallback
  introduced_in: V1.4.0
  log_level: WARN
  retryable: 'false'
- error_code: APP_LINK_BLOCKED
  http_status: 403
  user_message: 链接不在允许范围
  client_behavior: 阻断并提示
  introduced_in: V1.4.0
  log_level: WARN
  retryable: 'false'
- error_code: EXTERNAL_TARGET_BLOCKED
  http_status: 403
  user_message: 外部目标被阻断
  client_behavior: 不打开并记录
  introduced_in: V1.1.0
  log_level: WARN
  retryable: 'false'
- error_code: EXTERNAL_APP_UNAVAILABLE
  http_status: 422
  user_message: 目标应用未安装
  client_behavior: 浏览器或复制回退
  introduced_in: V1.1.0
  log_level: WARN
  retryable: 'false'
