schema_version: 1
desktop_root_windows: $env:USERPROFILE\Desktop\商推客交付\<version>\
artifact_rule: Only the exact GitHub Actions artifact tested for the source commit may be delivered. Local rebuilding is forbidden.
required_files:
- 商推客-<version>-release.apk
- FEATURES_PLANNED.md
- FEATURES_COMPLETED.md
- OWNER_TEST_CHECKLIST.md
- AUTOMATED_TEST_REPORT.md
- UI_SCREENSHOT_INDEX.csv
- VISUAL_DIFF_REPORT.md
- DEPLOYMENT_ENDPOINTS.md
- DNS_ACTION_REQUIRED.md
- BUILD_INFO.json
- CI_PROVENANCE.json
- KNOWN_ISSUES.md
- SHA256SUMS.txt
admin_handoff:
  release: V1.0.0
  url: https://stk-admin.zz-yihao.com/
  username: admin
  credential_file: ADMIN_ACCESS_HANDOFF.local.md
  git_allowed: false
  ci_artifact_allowed: false
  force_password_change: recommended_after_owner_login
apk_requirements:
  application_id: com.zzyihao.stk
  same_signature_all_releases: true
  minimum_real_size_mb: 10
  no_padding_files: true
  install_over_previous_required_from: V1.1.0
