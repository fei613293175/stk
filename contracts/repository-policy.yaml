schema_version: 1
remote_url: https://github.com/fei613293175/stk.git
visibility: public
default_branch: main
bootstrap_rule: Because the remote is empty, the initial project package/scaffold commit may establish main once; immediately
  after that, enable branch protection and develop each release on release/<version>.
release_branches:
- release/1.0.0
- release/1.1.0
- release/1.2.0
- release/1.3.0
- release/1.4.0
release_tags:
- stk-android-v1.0.0
- stk-android-v1.1.0
- stk-android-v1.2.0
- stk-android-v1.3.0
- stk-android-v1.4.0
required_status_checks:
- contract-validation
- android-build-test
- android-emulator-visual
- release-provenance
rules:
- No force push
- No rewriting delivered tags
- No secrets in public repository
- Atomic commits reference Feature ID
- One pull request per owner-facing release
- Merge only after required checks
- Server is not the source of truth
push_cadence: Push after a coherent code+test unit or when remote CI is required; do not create documentation-only noise commits
  during active implementation.
