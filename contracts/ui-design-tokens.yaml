hard_rules:
- 业务页面禁止直接声明 Color、dp、sp、RoundedCornerShape 或动画时长；只能引用 core-designsystem Token。
- 所有一级页面必须复用 StkRootScaffold；所有二级页面必须复用 StkPageScaffold。
- 内部业务页面禁止 WebView；第三方 H5 只允许通过受控 Custom Tabs 打开。
- 服务端可以下发数据、文案、开关和排序，不得下发字号、圆角、边距、坐标或任意页面布局。
- 效果图只决定视觉结构；功能以 Feature、Interaction、API 和后台合同为准。
- 未获得 APPROVED 效果图的 Page/State 不得宣称像素级验收完成。
