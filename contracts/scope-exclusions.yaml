schema_version: 1
applies_to:
- V1.0.0
- V1.1.0
- V1.2.0
- V1.3.0
- V1.4.0
excluded:
- PC user frontend
- iOS
- tablet-specific layout
- landscape UI
- internal business WebView
- online member payment
- order system
- withdrawal
- commission settlement
- task rewards
- prop purchase or inventory
- favorites business
- browse history business
- real-name collection
- chat
- distribution/referral
- red packets
- mini program
- dark mode
- server-driven UI layout
placeholder_policy: Where a visible entry is required, it must open an explicitly designed scope placeholder and must not
  create fake data, fake success, empty links, or 404 pages.
