              description: refresh_token,device_id
  /v1/auth/logout:
    post:
      operationId: logout
      summary: AUTH-006 - logout
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-006
      x-stk-introduced-in: V1.0.0
      x-stk-auth: BEARER
      x-stk-request-contract: refresh_token_family,device_id
      x-stk-success-contract: revoked=true
      x-stk-error-codes: AUTH_TOKEN_INVALID
      x-stk-idempotency: Idempotency-Key required
      x-stk-rate-limit: 按全局与场景策略
