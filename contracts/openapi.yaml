          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: mobile,password,password_confirmation,agreement_version,privacy_version,captcha_ticket,device_id
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: AUTH-005 - resetPassword
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-005
      x-stk-introduced-in: V1.0.0
      x-stk-auth: ANONYMOUS
      x-stk-request-contract: mobile,sms_code,new_password,password_confirmation,captcha_ticket,device_id
      x-stk-success-contract: reset=true,next_route
      x-stk-error-codes: SMS_CODE_INVALID|SMS_CODE_EXPIRED|AUTH_PASSWORD_WEAK|CAPTCHA_TICKET_INVALID
      x-stk-idempotency: Idempotency-Key required
      x-stk-rate-limit: 按全局与场景策略
      responses:
