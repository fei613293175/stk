  /v1/auth/token/refresh:
    post:
      operationId: refreshToken
      summary: AUTH-006 - refreshToken
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-006
      x-stk-introduced-in: V1.0.0
      x-stk-auth: REFRESH_TOKEN
      x-stk-request-contract: refresh_token,device_id
      x-stk-success-contract: rotated access_token and refresh_token
      x-stk-error-codes: AUTH_REFRESH_INVALID|AUTH_TOKEN_REUSED|AUTH_ACCOUNT_BLOCKED
      x-stk-idempotency: refresh token rotates atomically
      x-stk-rate-limit: 按全局与场景策略
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        default:
