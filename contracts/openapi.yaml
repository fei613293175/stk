      summary: PUBLISH-002 - createProject
      tags:
      - stk_project
      x-stk-feature-id: PUBLISH-002
      x-stk-introduced-in: V1.2.0
      x-stk-auth: BEARER
      x-stk-request-contract: title,summary,category_id,asset_ids,cover_asset_id,contact_type,contact_value,contact_name,publish_agreement_version
      x-stk-success-contract: project_id,status=pending|published,submitted_at,next_route
      x-stk-error-codes: PROJECT_VALIDATION_FAILED|PROJECT_DAILY_LIMIT|PROJECT_PENDING_LIMIT|PROJECT_DUPLICATE_SUBMISSION
      x-stk-idempotency: Idempotency-Key required
      x-stk-rate-limit: 按全局与场景策略
