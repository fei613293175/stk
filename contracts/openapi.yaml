      - stk_project
      x-stk-feature-id: HOME-001
      x-stk-introduced-in: V1.0.0
      x-stk-auth: BEARER
      x-stk-request-contract: cursor,limit<=30,keyword,category_id,sort=latest|recommended
      x-stk-success-contract: items, next_cursor, has_more, applied_filters
      x-stk-error-codes: PROJECT_QUERY_INVALID|PROJECT_SERVICE_UNAVAILABLE
      x-stk-idempotency: N/A
      x-stk-rate-limit: 按全局与场景策略
