openapi: 3.1.0
info:
  title: 商推客 Android API
  version: 1.0.0
  description: Discuz! X5.0 plugins stk_auth and stk_project. api-inventory.csv is the authoritative field and behavior catalog.
servers:
- url: https://stk-api.zz-yihao.com
  description: Production API
security:
- bearerAuth: []
paths:
  /v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: FND-002 - getBootstrap
      tags:
      - stk_auth
      x-stk-feature-id: FND-002
      x-stk-introduced-in: V1.0.0
      x-stk-auth: OPTIONAL_BEARER
      x-stk-request-contract: 'headers: app_version,version_code,device_id,locale'
      x-stk-success-contract: maintenance,auth_state,feature_flags,legal_versions,external_link_policy,release_policy
      x-stk-error-codes: SYS_MAINTENANCE|AUTH_TOKEN_EXPIRED|SYS_UNAVAILABLE
      x-stk-idempotency: N/A
      x-stk-rate-limit: 按全局与场景策略
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        default:
          description: Contracted error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: contracted_query
        in: query
        required: false
        schema:
          type: string
        description: 'headers: app_version,version_code,device_id,locale'
  /v1/auth/captcha/challenges:
    post:
      operationId: getCaptchaChallenge
      summary: AUTH-004 - getCaptchaChallenge
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-004
      x-stk-introduced-in: V1.0.0
      x-stk-auth: ANONYMOUS
      x-stk-request-contract: action,password_login|sms_send|sms_login|register|password_reset; device_id
      x-stk-success-contract: challenge_id,image_base64_or_url,expires_in
      x-stk-error-codes: CAPTCHA_RATE_LIMITED|CAPTCHA_UNAVAILABLE
      x-stk-idempotency: Idempotency-Key optional
      x-stk-rate-limit: 按全局与场景策略
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        default:
          description: Contracted error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: action,password_login|sms_send|sms_login|register|password_reset; device_id
  /v1/auth/captcha/verify:
    post:
      operationId: verifyCaptcha
      summary: AUTH-004 - verifyCaptcha
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-004
      x-stk-introduced-in: V1.0.0
      x-stk-auth: ANONYMOUS
      x-stk-request-contract: challenge_id,answer,action,device_id
      x-stk-success-contract: captcha_ticket,ticket_expires_in
      x-stk-error-codes: CAPTCHA_INVALID|CAPTCHA_EXPIRED|CAPTCHA_ATTEMPTS_EXCEEDED
      x-stk-idempotency: challenge one-use
      x-stk-rate-limit: 按全局与场景策略
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        default:
          description: Contracted error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: challenge_id,answer,action,device_id
  /v1/auth/sms/send:
    post:
      operationId: sendSmsCode
      summary: AUTH-002 - sendSmsCode
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-002
      x-stk-introduced-in: V1.0.0
      x-stk-auth: ANONYMOUS
      x-stk-request-contract: mobile,scene=login|password_reset,captcha_ticket,device_id
      x-stk-success-contract: request_id,resend_after,expires_in,masked_mobile
      x-stk-error-codes: SMS_RATE_LIMITED|SMS_PROVIDER_FAILED|SMS_SCENE_DISABLED|CAPTCHA_TICKET_INVALID
      x-stk-idempotency: Idempotency-Key required
      x-stk-rate-limit: 手机号+IP+设备+场景四维限流
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        default:
          description: Contracted error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: mobile,scene=login|password_reset,captcha_ticket,device_id
  /v1/auth/login/password:
    post:
      operationId: loginWithPassword
      summary: AUTH-001 - loginWithPassword
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-001
      x-stk-introduced-in: V1.0.0
      x-stk-auth: ANONYMOUS
      x-stk-request-contract: mobile,password,captcha_ticket,device_id,device_name
      x-stk-success-contract: access_token,access_expires_in,refresh_token,refresh_expires_in,user,next_route
      x-stk-error-codes: AUTH_INVALID_CREDENTIALS|AUTH_ACCOUNT_BLOCKED|CAPTCHA_TICKET_INVALID
      x-stk-idempotency: Idempotency-Key required
      x-stk-rate-limit: 按全局与场景策略
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        default:
          description: Contracted error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: mobile,password,captcha_ticket,device_id,device_name
  /v1/auth/login/sms:
    post:
      operationId: loginWithSms
      summary: AUTH-002 - loginWithSms
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-002
      x-stk-introduced-in: V1.0.0
      x-stk-auth: ANONYMOUS
      x-stk-request-contract: mobile,sms_code,captcha_ticket,device_id,device_name
      x-stk-success-contract: access_token,access_expires_in,refresh_token,refresh_expires_in,user,next_route
      x-stk-error-codes: SMS_CODE_INVALID|SMS_CODE_EXPIRED|AUTH_ACCOUNT_BLOCKED|CAPTCHA_TICKET_INVALID
      x-stk-idempotency: Idempotency-Key required
      x-stk-rate-limit: 按全局与场景策略
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        default:
          description: Contracted error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: mobile,sms_code,captcha_ticket,device_id,device_name
  /v1/auth/register:
    post:
      operationId: registerUser
      summary: AUTH-003 - registerUser
      tags:
      - stk_auth
      x-stk-feature-id: AUTH-003
      x-stk-introduced-in: V1.0.0
      x-stk-auth: ANONYMOUS
      x-stk-request-contract: mobile,password,password_confirmation,agreement_version,privacy_version,captcha_ticket,device_id
      x-stk-success-contract: uid,username,display_name,masked_mobile,mobile_verified=false,tokens,next_route
      x-stk-error-codes: AUTH_MOBILE_EXISTS|AUTH_PASSWORD_WEAK|LEGAL_VERSION_STALE|CAPTCHA_TICKET_INVALID
      x-stk-idempotency: Idempotency-Key required
      x-stk-rate-limit: 按全局与场景策略
      responses:
        '200':
