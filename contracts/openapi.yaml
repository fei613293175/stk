          type: string
      - name: contracted_query
        in: query
        required: false
        schema:
          type: string
        description: document_type=user_agreement|privacy_policy
  /v1/project/categories:
    get:
      operationId: listProjectCategories
      summary: HOME-002 - listProjectCategories
