components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque access token
  schemas:
    ApiEnvelope:
      type: object
      required:
      - code
      - message
      - data
      - request_id
      - server_time
      properties:
        code:
          type: string
          examples:
          - OK
        message:
          type: string
        data:
          type:
          - object
          - array
          - 'null'
        request_id:
          type: string
        server_time:
          type: integer
          description: Unix seconds
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - request_id
      - server_time
      properties:
        code:
          type: string
        message:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: string
        retry_after:
          type:
          - integer
          - 'null'
        request_id:
          type: string
        server_time:
          type: integer
